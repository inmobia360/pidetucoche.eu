name: Funcionalidad MVP
description: Proponer una funcionalidad trazable del producto
title: "[MVP] "
labels: ["mvp"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Resultado esperado
      description: Describe el resultado para el usuario o la operación.
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Requisito y contexto
      description: Enlaza pliego, backlog, decisión o ADR.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Criterios de aceptación
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Dinero, datos, permisos y riesgos
  - type: textarea
    id: tests
    attributes:
      label: Pruebas y evidencias requeridas

