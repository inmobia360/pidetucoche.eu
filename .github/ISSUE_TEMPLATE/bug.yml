name: Incidencia
description: Registrar un defecto o una regresión
title: "[BUG] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: Severidad
      options:
        - P0 — caída, pérdida, acceso o acción financiera no autorizada
        - P1 — flujo principal, pago, privacidad u operación crítica
        - P2 — inconsistencia o degradación relevante
        - P3 — mejora sin bloqueo inmediato
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Comportamiento observado
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamiento esperado
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproducción y evidencias
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impacto en dinero, datos o clientes

